<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Debug Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 3px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #d1ecf1; color: #0c5460; }
        .photo-test { display: flex; gap: 20px; margin: 10px 0; }
        .photo-test img { width: 100px; height: 100px; border: 1px solid #ccc; }
        .debug-info { background-color: #f8f9fa; padding: 10px; border-radius: 3px; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>
    <h1>Photo Debug Test</h1>
    
    <div class="test-section">
        <h2>1. Backend Connectivity Test</h2>
        <button onclick="testBackendConnection()">Test Backend Connection</button>
        <div id="backend-result"></div>
    </div>

    <div class="test-section">
        <h2>2. Member Data Test</h2>
        <button onclick="testMemberData()">Load and Test Member Data</button>
        <div id="member-result"></div>
    </div>

    <div class="test-section">
        <h2>3. Photo URL Construction Test</h2>
        <button onclick="testPhotoUrls()">Test Photo URL Construction</button>
        <div id="photo-result"></div>
    </div>

         <div class="test-section">
         <h2>4. Image Loading Test</h2>
         <button onclick="testImageLoading()">Test Image Loading</button>
         <button onclick="testActualMemberPhotos()">Test Actual Member Photos</button>
         <div id="image-result"></div>
     </div>

    <div class="test-section">
        <h2>5. Console Debug Info</h2>
        <div id="console-debug"></div>
    </div>

    <script>
        // Backend URL
        const backendUrl = 'https://narap-backend.onrender.com';
        
        // Default avatar
        const DEFAULT_AVATAR = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgdmlld0JveD0iMCAwIDEwMCAxMDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIiBmaWxsPSIjZGRkIi8+CjxjaXJjbGUgY3g9IjUwIiBjeT0iMzUiIHI9IjE1IiBmaWxsPSIjOTk5Ii8+CjxwYXRoIGQ9Ik0yMCA3NUw1MCA1NUw4MCA3NVY5MEgyMFY3NVoiIGZpbGw9IiM5OTkiLz4KPC9zdmc+';

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logDiv = document.getElementById('console-debug');
            const logEntry = document.createElement('div');
            logEntry.className = `test-result ${type}`;
            logEntry.innerHTML = `<strong>[${timestamp}]</strong> ${message}`;
            logDiv.appendChild(logEntry);
            console.log(`[${timestamp}] ${message}`);
        }

        async function testBackendConnection() {
            log('Testing backend connection...', 'info');
            const resultDiv = document.getElementById('backend-result');
            resultDiv.innerHTML = '<div class="test-result info">Testing...</div>';

            try {
                const response = await fetch(`${backendUrl}/api/health`);
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `
                        <div class="test-result success">
                            ✅ Backend is accessible<br>
                            Status: ${response.status}<br>
                            Response: ${JSON.stringify(data, null, 2)}
                        </div>
                    `;
                    log('Backend connection successful', 'success');
                } else {
                    resultDiv.innerHTML = `
                        <div class="test-result error">
                            ❌ Backend responded with error<br>
                            Status: ${response.status}<br>
                            Status Text: ${response.statusText}
                        </div>
                    `;
                    log(`Backend error: ${response.status} ${response.statusText}`, 'error');
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="test-result error">
                        ❌ Backend connection failed<br>
                        Error: ${error.message}
                    </div>
                `;
                log(`Backend connection failed: ${error.message}`, 'error');
            }
        }

        async function testMemberData() {
            log('Testing member data loading...', 'info');
            const resultDiv = document.getElementById('member-result');
            resultDiv.innerHTML = '<div class="test-result info">Loading member data...</div>';

            try {
                const response = await fetch(`${backendUrl}/api/users/members`);
                if (response.ok) {
                    const data = await response.json();
                    let members = [];
                    
                    if (Array.isArray(data)) {
                        members = data;
                    } else if (data && Array.isArray(data.members)) {
                        members = data.members;
                    } else if (data && Array.isArray(data.data)) {
                        members = data.data;
                    }

                    log(`Loaded ${members.length} members from backend`, 'success');

                    if (members.length > 0) {
                        const sampleMember = members[0];
                        resultDiv.innerHTML = `
                            <div class="test-result success">
                                ✅ Loaded ${members.length} members<br>
                                <strong>Sample Member:</strong><br>
                                Name: ${sampleMember.name}<br>
                                Photo fields: passportPhoto=${sampleMember.passportPhoto ? 'YES' : 'NO'}, passport=${sampleMember.passport ? 'YES' : 'NO'}<br>
                                <div class="debug-info">
                                    ${JSON.stringify(sampleMember, null, 2)}
                                </div>
                            </div>
                        `;
                    } else {
                        resultDiv.innerHTML = `
                            <div class="test-result error">
                                ⚠️ No members found in response
                            </div>
                        `;
                    }
                } else {
                    resultDiv.innerHTML = `
                        <div class="test-result error">
                            ❌ Failed to load members<br>
                            Status: ${response.status}
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="test-result error">
                        ❌ Error loading members: ${error.message}
                    </div>
                `;
                log(`Member data error: ${error.message}`, 'error');
            }
        }

        function getImageUrl(imagePath) {
            if (!imagePath) {
                return DEFAULT_AVATAR;
            }

            try {
                if (imagePath.startsWith('http://') || imagePath.startsWith('https://') || imagePath.startsWith('data:')) {
                    return imagePath;
                } else if (imagePath.startsWith('/')) {
                    return `${backendUrl}${imagePath}`;
                } else if (imagePath.includes('passportPhoto-') || imagePath.includes('signature-')) {
                    const fieldType = imagePath.includes('passportPhoto-') ? 'passports' : 'signatures';
                    return `${backendUrl}/api/uploads/${fieldType}/${imagePath}`;
                } else {
                    return `${backendUrl}/api/uploads/passports/${imagePath}`;
                }
            } catch (error) {
                return DEFAULT_AVATAR;
            }
        }

        async function testPhotoUrls() {
            log('Testing photo URL construction...', 'info');
            const resultDiv = document.getElementById('photo-result');
            resultDiv.innerHTML = '<div class="test-result info">Testing photo URLs...</div>';

            const testCases = [
                { name: 'Full URL', path: 'https://example.com/photo.jpg' },
                { name: 'Relative URL', path: '/uploads/photo.jpg' },
                { name: 'Passport filename', path: 'passportPhoto-123.jpg' },
                { name: 'Signature filename', path: 'signature-456.jpg' },
                { name: 'Simple filename', path: 'photo.jpg' },
                { name: 'Empty path', path: '' },
                { name: 'Null path', path: null }
            ];

            let results = '<div class="test-result info"><strong>Photo URL Test Results:</strong></div>';
            
            testCases.forEach(testCase => {
                const url = getImageUrl(testCase.path);
                results += `
                    <div class="test-result info">
                        <strong>${testCase.name}:</strong><br>
                        Input: ${testCase.path || 'null'}<br>
                        Output: ${url}<br>
                    </div>
                `;
            });

            resultDiv.innerHTML = results;
            log('Photo URL construction test completed', 'success');
        }

        async function testImageLoading() {
            log('Testing image loading...', 'info');
            const resultDiv = document.getElementById('image-result');
            resultDiv.innerHTML = '<div class="test-result info">Testing image loading...</div>';

            const testImages = [
                { name: 'Default Avatar', url: DEFAULT_AVATAR },
                { name: 'Backend Health Check', url: `${backendUrl}/api/health` },
                { name: 'Non-existent Image', url: `${backendUrl}/api/uploads/passports/nonexistent.jpg` }
            ];

            let results = '<div class="test-result info"><strong>Image Loading Test Results:</strong></div>';
            
            for (const testImage of testImages) {
                const imgDiv = document.createElement('div');
                imgDiv.className = 'photo-test';
                imgDiv.innerHTML = `
                    <div>
                        <strong>${testImage.name}:</strong><br>
                        <img src="${testImage.url}" alt="${testImage.name}" 
                             onload="log('✅ ${testImage.name} loaded successfully', 'success')"
                             onerror="log('❌ ${testImage.name} failed to load', 'error')">
                    </div>
                `;
                results += imgDiv.outerHTML;
            }

            resultDiv.innerHTML = results;
            log('Image loading test initiated', 'success');
        }

        async function testActualMemberPhotos() {
            log('Testing actual member photos...', 'info');
            const resultDiv = document.getElementById('image-result');
            resultDiv.innerHTML = '<div class="test-result info">Loading actual member photos...</div>';

            try {
                const response = await fetch(`${backendUrl}/api/users/members`);
                if (response.ok) {
                    const data = await response.json();
                    let members = [];
                    
                    if (Array.isArray(data)) {
                        members = data;
                    } else if (data && Array.isArray(data.members)) {
                        members = data.members;
                    } else if (data && Array.isArray(data.data)) {
                        members = data.data;
                    }

                    // Get first 3 members with photos
                    const membersWithPhotos = members.filter(m => m.passportPhoto).slice(0, 3);
                    
                    let results = '<div class="test-result info"><strong>Actual Member Photo Test:</strong></div>';
                    
                    for (const member of membersWithPhotos) {
                        const photoUrl = getImageUrl(member.passportPhoto);
                        const imgDiv = document.createElement('div');
                        imgDiv.className = 'photo-test';
                        imgDiv.innerHTML = `
                            <div>
                                <strong>${member.name}:</strong><br>
                                <small>Photo: ${member.passportPhoto}</small><br>
                                <small>URL: ${photoUrl}</small><br>
                                <img src="${photoUrl}" alt="${member.name}" 
                                     onload="log('✅ ${member.name} photo loaded successfully', 'success')"
                                     onerror="log('❌ ${member.name} photo failed to load', 'error')">
                            </div>
                        `;
                        results += imgDiv.outerHTML;
                    }

                    resultDiv.innerHTML = results;
                    log(`Testing ${membersWithPhotos.length} actual member photos`, 'success');
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="test-result error">
                        ❌ Error loading member photos: ${error.message}
                    </div>
                `;
                log(`Member photo test error: ${error.message}`, 'error');
            }
        }

        // Auto-run tests on page load
        window.addEventListener('load', () => {
            log('Photo debug page loaded', 'info');
            setTimeout(() => {
                testBackendConnection();
            }, 1000);
        });
    </script>
</body>
</html>
