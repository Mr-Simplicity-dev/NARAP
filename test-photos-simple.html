<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NARAP Photo Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .photo-test { width: 100px; height: 120px; border: 1px solid #ccc; margin: 10px 0; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; font-family: monospace; }
        .success { color: green; }
        .error { color: red; }
        .warning { color: orange; }
    </style>
</head>
<body>
    <h1>🔍 NARAP Photo Display Test</h1>
    
    <div class="test-section">
        <h2>Backend Connection</h2>
        <input type="text" id="backendUrl" value="https://narap-backend.onrender.com" style="width: 300px;">
        <button onclick="testConnection()">Test Connection</button>
        <div id="connectionStatus"></div>
    </div>
    
    <div class="test-section">
        <h2>Member Table Photos</h2>
        <button onclick="testMemberTable()">Test Member Table</button>
        <div id="memberTableResults"></div>
    </div>
    
    <div class="test-section">
        <h2>Member Verification Photos</h2>
        <input type="text" id="memberCode" value="N/045/ANA/05" placeholder="Member Code">
        <button onclick="testVerification()">Test Verification</button>
        <div id="verificationResults"></div>
    </div>
    
    <div class="test-section">
        <h2>URL Construction Test</h2>
        <button onclick="testUrlConstruction()">Test URLs</button>
        <div id="urlResults"></div>
    </div>
    
    <div class="test-section">
        <h2>Test Log</h2>
        <button onclick="clearLog()">Clear Log</button>
        <div id="log"></div>
    </div>

    <script>
        let backendUrl = 'https://narap-backend.onrender.com';
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `<div class="${type}">[${timestamp}] ${message}</div>`;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }
        
        async function testConnection() {
            backendUrl = document.getElementById('backendUrl').value;
            log(`Testing connection to: ${backendUrl}`);
            
            try {
                const response = await fetch(`${backendUrl}/api/health`);
                if (response.ok) {
                    document.getElementById('connectionStatus').innerHTML = '<span class="success">✅ Connected</span>';
                    log('Backend connection successful', 'success');
                } else {
                    document.getElementById('connectionStatus').innerHTML = '<span class="error">❌ Error</span>';
                    log(`Backend error: ${response.status}`, 'error');
                }
            } catch (error) {
                document.getElementById('connectionStatus').innerHTML = '<span class="error">❌ Failed</span>';
                log(`Connection failed: ${error.message}`, 'error');
            }
        }
        
        async function testMemberTable() {
            log('Testing member table photos...');
            
            try {
                const response = await fetch(`${backendUrl}/api/users/members`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                const members = data.members || data.data || [];
                
                log(`Found ${members.length} members`);
                
                const membersWithPhotos = members.filter(m => m.passportPhoto || m.passport).slice(0, 3);
                
                let results = '<h3>Testing Member Photos:</h3>';
                membersWithPhotos.forEach((member, index) => {
                    const photoUrl = member.passportPhoto || member.passport;
                    const imageUrl = getImageUrl(photoUrl);
                    
                    results += `
                        <div style="margin: 10px 0; padding: 10px; border: 1px solid #eee;">
                            <h4>${member.name} (${member.code})</h4>
                            <p>Photo URL: ${photoUrl || 'None'}</p>
                            <p>Constructed URL: ${imageUrl}</p>
                            <div class="photo-test">
                                <img src="${imageUrl}" 
                                     alt="Member Photo" 
                                     style="max-width: 100%; max-height: 100%;"
                                     onload="log('✅ Photo loaded: ' + this.src, 'success')"
                                     onerror="log('❌ Photo failed: ' + this.src, 'error')">
                            </div>
                        </div>
                    `;
                });
                
                document.getElementById('memberTableResults').innerHTML = results;
                
            } catch (error) {
                log(`Member table test failed: ${error.message}`, 'error');
                document.getElementById('memberTableResults').innerHTML = `<span class="error">Test failed: ${error.message}</span>`;
            }
        }
        
        async function testVerification() {
            const memberCode = document.getElementById('memberCode').value;
            log(`Testing member verification: ${memberCode}`);
            
            try {
                const response = await fetch(`${backendUrl}/api/users/members/verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: memberCode })
                });
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                
                if (data.success && data.member) {
                    const member = data.member;
                    const photoUrl = member.passportPhoto || member.passport;
                    
                    log(`Member found: ${member.name}`, 'success');
                    log(`Photo URL: ${photoUrl || 'None'}`);
                    
                    const results = `
                        <h3>Verification Result:</h3>
                        <p><strong>Name:</strong> ${member.name}</p>
                        <p><strong>Code:</strong> ${member.code}</p>
                        <p><strong>Photo URL:</strong> ${photoUrl || 'None'}</p>
                        ${photoUrl ? `
                            <div class="photo-test">
                                <img src="${photoUrl}" 
                                     alt="Member Photo" 
                                     style="max-width: 100%; max-height: 100%;"
                                     onload="log('✅ Verification photo loaded', 'success')"
                                     onerror="log('❌ Verification photo failed', 'error')">
                            </div>
                        ` : '<p>No photo available</p>'}
                    `;
                    
                    document.getElementById('verificationResults').innerHTML = results;
                } else {
                    log(`Member not found: ${memberCode}`, 'warning');
                    document.getElementById('verificationResults').innerHTML = `<span class="warning">Member not found: ${memberCode}</span>`;
                }
                
            } catch (error) {
                log(`Verification test failed: ${error.message}`, 'error');
                document.getElementById('verificationResults').innerHTML = `<span class="error">Test failed: ${error.message}</span>`;
            }
        }
        
        function testUrlConstruction() {
            log('Testing URL construction...');
            
            const testFilenames = [
                'passportPhoto-1754305054377-936666238.png',
                'signature-1754305054378-123456789.png'
            ];
            
            let results = '<h3>URL Construction Test:</h3>';
            
            testFilenames.forEach(filename => {
                const imageUrl = getImageUrl(filename);
                const cloudinaryUrls = [
                    `https://res.cloudinary.com/dh5wjtvlf/image/upload/v1/NARAP/passportPhoto/${filename}`,
                    `https://res.cloudinary.com/dh5wjtvlf/image/upload/NARAP/passportPhoto/${filename}`
                ];
                
                results += `
                    <div style="margin: 10px 0; padding: 10px; border: 1px solid #eee;">
                        <h4>Filename: ${filename}</h4>
                        <p><strong>Constructed URL:</strong> ${imageUrl}</p>
                        <p><strong>Cloudinary v1:</strong> ${cloudinaryUrls[0]}</p>
                        <p><strong>Cloudinary:</strong> ${cloudinaryUrls[1]}</p>
                        
                        <h5>Testing URLs:</h5>
                        <div class="photo-test">
                            <img src="${imageUrl}" 
                                 alt="Test 1" 
                                 style="max-width: 100%; max-height: 100%;"
                                 onload="log('✅ URL 1 loaded', 'success')"
                                 onerror="log('❌ URL 1 failed', 'error')">
                        </div>
                        <div class="photo-test">
                            <img src="${cloudinaryUrls[0]}" 
                                 alt="Test 2" 
                                 style="max-width: 100%; max-height: 100%;"
                                 onload="log('✅ Cloudinary v1 loaded', 'success')"
                                 onerror="log('❌ Cloudinary v1 failed', 'error')">
                        </div>
                        <div class="photo-test">
                            <img src="${cloudinaryUrls[1]}" 
                                 alt="Test 3" 
                                 style="max-width: 100%; max-height: 100%;"
                                 onload="log('✅ Cloudinary loaded', 'success')"
                                 onerror="log('❌ Cloudinary failed', 'error')">
                        </div>
                    </div>
                `;
            });
            
            document.getElementById('urlResults').innerHTML = results;
        }
        
        function getImageUrl(imagePath) {
            if (!imagePath) {
                return 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgdmlld0JveD0iMCAwIDEwMCAxMDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIiBmaWxsPSIjZjhmOWZhIi8+CjxjaXJjbGUgY3g9IjUwIiBjeT0iMzUiIHI9IjE1IiBmaWxsPSIjNjY3ZWVhIi8+CjxwYXRoIGQ9Ik0yMCA3NUg4MFY4NUgyMFY3NVoiIGZpbGw9IiM2NjdlZWEiLz4KPC9zdmc+';
            }

            let validImageUrl = null;
            
            try {
                if (imagePath.startsWith('http://') || imagePath.startsWith('https://') || imagePath.startsWith('data:')) {
                    validImageUrl = imagePath;
                } else if (imagePath.startsWith('/')) {
                    validImageUrl = `${backendUrl}${imagePath}`;
                } else if (imagePath.includes('passportPhoto-') || imagePath.includes('signature-')) {
                    const fieldType = imagePath.includes('passportPhoto-') ? 'passportPhoto' : 'signature';
                    validImageUrl = `${backendUrl}/api/uploads/${fieldType === 'passportPhoto' ? 'passports' : 'signatures'}/${imagePath}`;
                } else if (imagePath.includes('uploads/passports/')) {
                    const filename = imagePath.split('uploads/passports/').pop();
                    validImageUrl = `${backendUrl}/api/uploads/passports/${filename}`;
                } else if (imagePath.includes('uploads/signatures/')) {
                    const filename = imagePath.split('uploads/signatures/').pop();
                    validImageUrl = `${backendUrl}/api/uploads/signatures/${filename}`;
                } else if (imagePath.includes('\\') || imagePath.includes('/')) {
                    const filename = imagePath.split(/[\\/]/).pop();
                    validImageUrl = `${backendUrl}/api/uploads/passports/${filename}`;
                } else {
                    validImageUrl = `${backendUrl}/api/uploads/passports/${imagePath}`;
                }
                
                return validImageUrl;
            } catch (error) {
                return 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgdmlld0JveD0iMCAwIDEwMCAxMDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIiBmaWxsPSIjZjhmOWZhIi8+CjxjaXJjbGUgY3g9IjUwIiBjeT0iMzUiIHI9IjE1IiBmaWxsPSIjNjY3ZWVhIi8+CjxwYXRoIGQ9Ik0yMCA3NUg4MFY4NUgyMFY3NVoiIGZpbGw9IiM2NjdlZWEiLz4KPC9zdmc+';
            }
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            log('Photo display test initialized');
        });
    </script>
</body>
</html>
