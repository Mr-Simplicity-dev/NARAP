<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Verification Fixes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Task Force Button Styles */
        .task-force-button {
            background: #dc3545;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 4px rgba(220, 53, 69, 0.3);
            text-decoration: none;
            font-size: 14px;
            margin: 0 auto; /* Center the button */
        }

        .task-force-button:hover {
            background: #c82333;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(220, 53, 69, 0.4);
            color: white;
            text-decoration: none;
        }

        /* Impersonation Warning Styles */
        .impersonation-warning {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 12px rgba(255, 193, 7, 0.15);
            transition: all 0.3s ease;
        }

        .impersonation-warning:hover {
            box-shadow: 0 6px 16px rgba(255, 193, 7, 0.25);
        }

        .impersonation-content {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .impersonation-text {
            flex: 1;
            min-width: 300px;
        }

        .impersonation-title {
            color: #856404;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .impersonation-description {
            color: #856404;
            font-size: 14px;
            line-height: 1.5;
            margin: 0;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        /* Mobile responsive styles */
        @media (max-width: 768px) {
            .impersonation-content {
                flex-direction: column;
                gap: 15px;
            }
            
            .impersonation-text {
                min-width: auto;
            }
            
            .task-force-button {
                width: 100%;
                justify-content: center;
                padding: 14px 24px;
                font-size: 16px;
                margin: 0 auto; /* Center the button on mobile */
            }
        }
    </style>
</head>
<body>
    <div style="padding: 20px;">
        <h1>Test Verification Fixes</h1>
        
        <button onclick="testModal()" class="btn btn-primary">Test Modal with Impersonation Warning</button>
        <button onclick="testMultipleCalls()" class="btn btn-secondary">Test Multiple Calls (Should Not Duplicate)</button>
        
        <div id="testModal" class="modal">
            <div class="modal-content">
                <h2>Member Verification Result</h2>
                <p>This is a test modal to verify the fixes work correctly.</p>
                
                <div class="modal-buttons">
                    <button class="btn btn-primary" onclick="closeModal()">Close</button>
                    <button class="btn btn-secondary" onclick="testMultipleCalls()">Test Again</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function testModal() {
            const modal = document.getElementById('testModal');
            modal.style.display = 'block';
            
            // Add impersonation warning after modal buttons (prevent duplication)
            setTimeout(() => {
                const modalButtons = document.querySelector('.modal-buttons');
                if (modalButtons) {
                    // Check if impersonation warning already exists
                    const existingWarning = document.querySelector('.impersonation-warning');
                    if (existingWarning) {
                        // Remove existing warning to prevent duplication
                        existingWarning.remove();
                    }
                    
                    const impersonationWarning = document.createElement('div');
                    impersonationWarning.className = 'impersonation-warning';
                    impersonationWarning.innerHTML = `
                        <div class="impersonation-content">
                            <div class="impersonation-text">
                                <h5 class="impersonation-title">
                                    <i class="fas fa-exclamation-triangle" style="color: #f39c12;"></i>
                                    Impersonation Warning
                                </h5>
                                <p class="impersonation-description">
                                    If you suspect this member is being impersonated or if you notice any suspicious activity, 
                                    please contact the NARAP Task Force immediately. They are available 24/7 to handle security concerns.
                                </p>
                            </div>
                            <div style="display: flex; justify-content: center;">
                                <button onclick="callTaskForce()" class="task-force-button">
                                    <i class="fas fa-phone" style="font-size: 14px;"></i>
                                    Task Force
                                </button>
                            </div>
                        </div>
                    `;
                    
                    // Insert after modal buttons
                    modalButtons.parentNode.insertBefore(impersonationWarning, modalButtons.nextSibling);
                }
            }, 100);
        }

        function testMultipleCalls() {
            console.log('Testing multiple calls...');
            testModal();
        }

        function closeModal() {
            document.getElementById('testModal').style.display = 'none';
        }

        function callTaskForce() {
            const phoneNumber = '07067012884';
            alert(`Task Force button clicked! Phone: ${phoneNumber}`);
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('testModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }
    </script>
</body>
</html>
